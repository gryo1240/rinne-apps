<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月夜の集中タイマー｜ポモドーロ式の無料作業タイマー</title>
<meta name="description" content="夜空の下で集中。25分作業+5分休憩のポモドーロ式タイマー。占い師・宵乃こよみが夜のお供に。今日の集中時間も自動で記録される無料アプリです。">
<meta name="theme-color" content="#1F2733">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* 2026-09-29 刷新（同日オーナー指示「月夜って感じ」で作り直し）:「月の文字盤」。
     文字盤そのものが月。残り時間は月の明るい面、過ぎた時間は日時計の影のように回ってくる夜の影で覆われていく。
     色は 墨を混ぜた藍の夜・月の生成り・灰銀 の3系統。光らせない（glow・グラデーションの夜空・金は使わない）。
     数字と見出しは同梱の BIZ UDゴシック Bold（使う文字だけ・SIL OFL）。
     見せ場は1つだけ: 月の明るい面が、時間とともに影に覆われていく（既存の SVG の円をそのまま使う。
       ring-bg を月の円盤、ring-fg を太さ260の影色の線にして「過ぎた分」を覆う。進み方は JS のまま）。
     休憩中は、月の手前に薄い雲の帯が1本かかる（朧月）。
     こよみの写真は小さな写真立て（動かさない）。ひと言は月明かりで読む書き付け。
     ⚠ 文言を変えたら fonts/chars.txt を作り直してフォントを再生成する */
  @font-face { font-family: "FT Num"; font-weight: 700; font-display: swap; src: url("fonts/biz-udgothic-700.woff") format("woff"); }
  :root { --night: #1F2733; --moon: #E9E2CC; --shade: #323C4B; --ink: #1B2129; --silver: #A9B0B8; --line: #3E4958; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
    /* 夜: 単色。瞬かない星を数個だけ */
    background-color: var(--night);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(233,226,204,.55) 0 1px, transparent 1.6px),
      radial-gradient(circle at 91% 7%, rgba(233,226,204,.45) 0 1px, transparent 1.6px),
      radial-gradient(circle at 84% 31%, rgba(233,226,204,.35) 0 .8px, transparent 1.4px),
      radial-gradient(circle at 14% 44%, rgba(233,226,204,.35) 0 .8px, transparent 1.4px),
      radial-gradient(circle at 95% 58%, rgba(233,226,204,.4) 0 1px, transparent 1.6px),
      radial-gradient(circle at 5% 76%, rgba(233,226,204,.3) 0 .8px, transparent 1.4px);
    color: var(--moon);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #sky { display: none; }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 18px 14px 26px; text-align: center; }

  .head h1 { font-family: "FT Num", sans-serif; font-size: 20px; letter-spacing: .12em; color: var(--moon); font-weight: 700; }
  .head p { font-size: 12px; color: var(--silver); margin-top: 2px; }

  /* モード選択 */
  .modes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 4px; }
  .mode {
    padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: "FT Num", sans-serif;
    color: var(--moon); background: transparent;
    border: 1px solid #6B7584; border-radius: 3px; transition: background .15s, color .15s;
  }
  .mode.active { color: var(--ink); background: var(--moon); border-color: var(--moon); }
  .custom-row { display: none; gap: 10px; justify-content: center; align-items: center; margin-top: 10px; font-size: 13px; color: var(--silver); }
  .custom-row.show { display: flex; }
  .custom-hint { display: none; font-size: 11px; color: var(--silver); margin-top: 5px; }
  .custom-hint.show { display: block; }
  .custom-row input {
    width: 62px; padding: 5px 6px; font-size: 15px; font-weight: 700; text-align: center; font-family: "FT Num", sans-serif;
    color: var(--ink); background: var(--moon);
    border: 1px solid var(--moon); border-radius: 3px;
  }

  /* 月の文字盤: 外周は夜の地に月色の目盛り（5分ごとに太く）、内側が月。月の面には海（暗い模様）を塗りで入れる。光らせない */
  .dial { position: relative; width: 290px; height: 290px; margin: 18px auto 6px; border-radius: 50%;
    background:
      radial-gradient(ellipse 17% 12% at 66% 26%, rgba(160,150,122,.20), transparent 100%),
      radial-gradient(ellipse 11% 17% at 78% 54%, rgba(160,150,122,.17), transparent 100%),
      radial-gradient(ellipse 15% 10% at 34% 74%, rgba(160,150,122,.16), transparent 100%),
      radial-gradient(ellipse 11% 9% at 38% 22%, rgba(160,150,122,.14), transparent 100%),
      radial-gradient(circle closest-side, var(--moon) 0 82.8%, transparent 83.2%),
      repeating-conic-gradient(from -1deg, var(--moon) 0 2deg, transparent 2deg 30deg),
      repeating-conic-gradient(from -.4deg, #6F7888 0 .8deg, transparent .8deg 6deg),
      #263040;
    box-shadow: 0 0 0 1px var(--line);
  }
  /* 円の外周を切り取って扇にする（ring-fg の太い線が中心まで届く）。月そのものは .dial の背景に描いてある */
  .dial svg { transform: rotate(-90deg) scaleY(-1); clip-path: circle(41.4% at 50% 50%); }
  .ring-bg { fill: none; stroke: none; }
  .ring-fg { fill: none; stroke: var(--shade); stroke-width: 260; transition: stroke-dashoffset .3s linear; }
  .ring-fg.break { stroke: var(--shade); }
  /* 扇の切り口のふちに出るにじみを、文字盤の色の細い輪で隠す */
  .dial::after { content: ""; position: absolute; left: 50%; top: 50%; width: calc(82.8% + 3px); height: calc(82.8% + 3px); box-sizing: border-box;
    transform: translate(-50%,-50%); border-radius: 50%; border: 3px solid var(--moon); pointer-events: none; }
  /* 休憩中: 月の手前に薄い雲の帯（朧月） */
  .dial::before { content: ""; position: absolute; left: -4%; right: -4%; top: 60%; height: 7%; border-radius: 50%; pointer-events: none; z-index: 1;
    /* 月の上でも見えるよう、雲は明るい銀ではなく灰に（レビュー: 明るい雲は月と 1.21:1 で見えなかった） */
    background: linear-gradient(90deg, transparent, rgba(120,128,140,.55) 18%, rgba(128,136,148,.66) 50%, rgba(120,128,140,.52) 84%, transparent);
    opacity: 0; transition: opacity .6s; }
  .dial:has(.ring-fg.break)::before { opacity: 1; }
  /* 中央のつまみ: 時刻と状態はここに書く */
  .dial-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; z-index: 2;
  }
  .dial-center::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 56%; height: 56%; transform: translate(-50%,-50%);
    border-radius: 50%; background: var(--moon); box-shadow: 0 0 0 1px #C9C1A8; z-index: -1;
  }
  .state { font-size: 13px; letter-spacing: .3em; color: #5B6270; font-family: "FT Num", sans-serif; font-weight: 700; }
  .state.working { color: var(--ink); }
  .state.resting { color: #5B6270; }
  .time { font-family: "FT Num", sans-serif; font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; color: var(--ink); }
  .cycle-dots { display: flex; gap: 7px; margin-top: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #7D7766; }
  .dot.done { background: var(--ink); border-color: var(--ink); }

  /* こよみ: 小さな写真立て ＋ 月明かりで読む書き付け */
  .says { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 12px auto 14px; max-width: 452px; }
  .koyomi { position: relative; flex: 0 0 auto; width: 88px; height: 108px; }
  .koyomi .glow, .koyomi .spark { display: none; }
  .koyomi .frame {
    position: absolute; inset: 0; border-radius: 2px; overflow: hidden;
    border: 4px solid var(--moon); box-shadow: 0 0 0 1px var(--line);
  }
  .koyomi .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
  .koyomi .pic.on { opacity: 1; }

  .bubble {
    position: relative; text-align: left; font-size: 13.5px; line-height: 1.55; color: var(--moon);
    background: transparent; border: 0; border-left: 2px solid var(--silver);
    padding: 6px 4px 6px 14px; border-radius: 0; min-height: 20px;
    min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; text-wrap: pretty;
  }
  .bubble::before { display: none; }
  .bubble.pop { animation: none; }

  /* ボタン */
  .btns { display: flex; gap: 10px; justify-content: center; }
  button.ctl {
    min-width: 118px; padding: 13px 18px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: "FT Num", sans-serif;
    border-radius: 4px; border: 1px solid var(--moon); transition: transform .1s;
  }
  button.ctl:active { transform: scale(.97); }
  #btnMain { background: var(--moon); color: var(--ink); border-color: var(--moon); }
  .ctl.sub { background: transparent; color: var(--moon); border-color: #7C8594; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }

  /* 統計 */
  .stats {
    margin-top: 18px; padding: 12px; font-size: 13px; color: var(--silver);
    background: transparent; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0;
  }
  .stats b { color: var(--moon); font-size: 16px; font-family: "FT Num", sans-serif; }

  .note { margin-top: 12px; font-size: 11px; color: var(--silver); }
  .note .who { color: var(--moon); }

  @media (max-width: 380px) {
    .dial { width: 250px; height: 250px; }
    .dial svg { width: 250px; height: 250px; }
    .time { font-size: 42px; }
    .koyomi { width: 80px; height: 98px; }
    .says { gap: 10px; }
    .bubble { font-size: 13px; padding: 6px 2px 6px 10px; }
    /* 改修前から320px以下で3つのボタンが横にはみ出していた */
    button.ctl { min-width: 0; flex: 1 1 0; padding: 13px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .koyomi .pic { transition-duration: .01s; }
    .dial::before { transition-duration: .05s; }
  }
  @media (forced-colors: active) {
    .dial svg { clip-path: none; }
    .ring-bg { fill: none; stroke: CanvasText; stroke-width: 2; }
    .ring-fg { stroke: Highlight; stroke-width: 10; }
    .dial::before { display: none; }
  }
</style>
<script src="jp-phrase-3.js" defer></script>
</head>
<body>
<div id="sky"></div>
<div class="wrap">

  <header class="head">
    <h1>月夜の集中タイマー</h1>
    <p>しずかな夜空の下で、こよみと一緒に集中。</p>
  </header>

  <div class="modes">
    <button class="mode active" data-work="25" data-break="5" type="button">25分＋休憩5分</button>
    <button class="mode" data-work="50" data-break="10" type="button">50分＋休憩10分</button>
    <button class="mode" data-custom="1" type="button">カスタム</button>
  </div>
  <div class="custom-row" id="customRow">
    作業 <input type="number" id="cWork" min="1" max="120" value="30"> 分
    ／ 休憩 <input type="number" id="cBreak" min="1" max="30" value="5"> 分
  </div>
  <div class="custom-hint" id="customHint">作業は1〜120分、休憩は1〜30分まで設定できます</div>

  <div class="dial">
    <svg width="290" height="290" viewBox="0 0 290 290">
      <circle class="ring-bg" cx="145" cy="145" r="130"></circle>
      <circle class="ring-fg" id="ring" cx="145" cy="145" r="130"></circle>
    </svg>
    <div class="dial-center">
      <div class="state" id="state">じゅんび</div>
      <div class="time" id="time" data-nophrase>25:00</div>
      <div class="cycle-dots" id="dots" data-nophrase></div>
    </div>
  </div>

  <div class="says">
    <div class="koyomi" id="koyomi">
      <div class="glow" aria-hidden="true"></div>
      <div class="frame">
        <img class="pic pic-work" src="koyomi-work-mini.jpg" alt="占い中の宵乃こよみ">
        <img class="pic pic-rest on" src="koyomi-rest-mini.jpg" alt="読書中の宵乃こよみ">
      </div>
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
    </div>
    <div class="bubble" id="bubble">スタートを押すと、集中がはじまりますよ🌙</div>
  </div>

  <div class="btns">
    <button class="ctl" id="btnMain" type="button">スタート</button>
    <button class="ctl sub" id="btnSkip" type="button">スキップ</button>
    <button class="ctl sub" id="btnReset" type="button">リセット</button>
  </div>

  <div class="stats">
    今日の集中時間: <b id="todayTotal">0分</b>
    <span id="sessionCount"></span>
  </div>

  <p class="note">4回の集中ごとに長めの休憩が入ります。音が鳴るので音量にご注意ください<br>
  スマホでは「ホーム画面に追加」で単独アプリとして使えます。<br>
  夜のお供は占い師 <span class="who">宵乃こよみ</span>。集中時は占い、休憩時は読書でそばにいます</p>

</div>

<script>
"use strict";
function $(id) { return document.getElementById(id); }

/* ---------- 星空 ---------- */
(function stars() {
  const sky = $("sky");
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 3}s;`;
    sky.appendChild(s);
  }
})();

/* ---------- こよみの表情切替(work=占い / rest=読書) ---------- */
function setScene(kind) {
  document.querySelector(".pic-work").classList.toggle("on", kind === "work");
  document.querySelector(".pic-rest").classList.toggle("on", kind === "rest");
}

/* ---------- こよみの吹き出し ---------- */
function say(text) {
  const b = $("bubble");
  b.textContent = text;
  b.classList.remove("pop");
  void b.offsetWidth;      // リフローで再アニメーション
  b.classList.add("pop");
}

/* ---------- 設定 ---------- */
let workMin = 25, breakMin = 5;
const LONG_EVERY = 4;               // 4回の集中ごとに長休憩
const longBreakMin = () => Math.min(breakMin * 3, 30);

/* ---------- 状態 ---------- */
let mode = "work";                  // work | break
let running = false;
let endTime = 0;                    // 実時刻ベース(タブが裏でも正確)
let remaining = workMin * 60;       // 停止中の残り秒
let doneSessions = 0;               // 今サイクルの完了数(0-3)
let lastTick = 0;

const RING_C = 2 * Math.PI * 130;
$("ring").style.strokeDasharray = RING_C;

/* こよみの声(やわらかい丁寧語・不安を煽らない) */
const BREAK_MSGS = [
  "おつかれさま。お茶を一杯どうぞ🍵",
  "肩の力を抜いて、ふぅっと深呼吸を",
  "窓の外の夜空を、すこし眺めてみましょう",
  "軽くのびをして、リフレッシュしましょうね",
  "お水を飲んで、ひと休みしてくださいね",
  "目を閉じて30秒、休ませてあげましょう",
];
const WORK_MSGS = [
  "わたしも占いに集中しますね。一緒にがんばりましょう🌙",
  "ひとつのことに、しずかに集中してみてくださいね",
  "だいじょうぶ、お月さまが見守っていますよ",
];

/* ---------- 今日の記録 (localStorage) ---------- */
const KEY = "tsukiyo-focus-stats";
// 日本時間の日付（端末の時差に関係なく、日本時間の0時で切り替わる）
function todayKey() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }
function loadStats() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
function addFocusSeconds(sec) {
  const s = loadStats();
  s[todayKey()] = (s[todayKey()] || 0) + sec;
  // 古い日付は7日分だけ残す
  const keys = Object.keys(s).sort().slice(-7);
  const trimmed = {};
  keys.forEach(k => trimmed[k] = s[k]);
  try { localStorage.setItem(KEY, JSON.stringify(trimmed)); } catch (e) {}
  renderStats();
}
function renderStats() {
  const sec = loadStats()[todayKey()] || 0;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  $("todayTotal").textContent = h > 0 ? `${h}時間${m}分` : `${m}分`;
}

/* ---------- チャイム (WebAudio・外部ファイル不要) ---------- */
/* iPhoneの消音スイッチ対策（2026-08-16）。
   iOSはWeb Audioを「ambient」区分で鳴らすので、本体の消音スイッチだけで無音になる。
   エラーも出ないため「設定はオンなのに鳴らない」という形で表面化する。
   audioSession.type を 'playback' にすると音楽と同じ扱いになる（iOS 16.4以降）。
   ★AudioContext を作る前に呼ぶこと（区分は生成時に決まる）。未対応の端末では何も起きない。
   教訓: .company/lessons/audio-ios-silent-switch.md */
function claimPlayback() {
  try {
    const s = navigator.audioSession;
    if (s && s.type !== "playback") s.type = "playback";
  } catch (e) {}
}
claimPlayback();
window.addEventListener("pointerdown", claimPlayback, { capture: true, passive: true });

let audioCtx = null;
function chime(times) {
  try {
    claimPlayback();
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const t0 = audioCtx.currentTime + i * 0.5;
      [880, 1320].forEach(freq => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = freq; o.type = "sine";
        g.gain.setValueAtTime(0.12, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + 0.5);
      });
    }
  } catch (e) {}
}

/* ---------- 表示 ---------- */
function totalSec() {
  if (mode === "work") return workMin * 60;
  return (doneSessions === 0 ? longBreakMin() : breakMin) * 60;  // doneSessions=0はサイクル完了直後=長休憩
}
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
}
function render() {
  const rem = running ? (endTime - Date.now()) / 1000 : remaining;
  $("time").textContent = fmt(rem);
  const prog = 1 - Math.max(0, rem) / totalSec();
  $("ring").style.strokeDashoffset = RING_C * (1 - prog);
  $("ring").classList.toggle("break", mode === "break");

  const st = $("state");
  if (!running && rem === totalSec()) { st.textContent = "じゅんび"; st.className = "state"; }
  else if (mode === "work") { st.textContent = running ? "集中時" : "一時停止"; st.className = "state working"; }
  else { st.textContent = running ? "休憩時" : "一時停止"; st.className = "state resting"; }

  document.title = running ? `${mode === "work" ? "▶" : "☕"} ${fmt(rem)} - 月夜の集中タイマー` : "月夜の集中タイマー";

  const dots = $("dots");
  dots.innerHTML = "";
  for (let i = 0; i < LONG_EVERY; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < doneSessions ? " done" : "");
    dots.appendChild(d);
  }
}

/* ---------- タイマー進行 ---------- */
function tick() {
  if (!running) return;
  const now = Date.now();
  if (mode === "work" && lastTick) {
    focusBuffer += (now - lastTick) / 1000;
    if (focusBuffer >= 10) { addFocusSeconds(Math.round(focusBuffer)); focusBuffer = 0; }
  }
  lastTick = now;
  if (now >= endTime) { complete(); return; }
  render();
}
let focusBuffer = 0;

function flushFocus() {
  if (focusBuffer > 0) { addFocusSeconds(Math.round(focusBuffer)); focusBuffer = 0; }
}

function complete() {
  flushFocus();
  lastTick = 0;
  if (mode === "work") {
    doneSessions++;
    const isLong = doneSessions >= LONG_EVERY;
    if (isLong) doneSessions = 0;
    mode = "break";
    remaining = (isLong ? longBreakMin() : breakMin) * 60;
    // 長休憩判定をtotalSecで再現するためのフラグ調整: doneSessions=0 かつ mode=break → 長休憩
    if (!isLong && doneSessions === 0) doneSessions = LONG_EVERY - 1; // 保険(通常起きない)
    setScene("rest");   // こよみも月夜の読書でひと休み
    say((isLong ? "たくさん集中できましたね。長めに休みましょう。" : "ひと区切りですね、おつかれさま。") + " " + BREAK_MSGS[Math.floor(Math.random() * BREAK_MSGS.length)]);
    chime(2);
  } else {
    mode = "work";
    remaining = workMin * 60;
    setScene("work");   // こよみも占いを再開
    say("さあ、つぎの集中をはじめましょうか🌙");
    chime(1);
  }
  endTime = Date.now() + remaining * 1000;
  running = true;   // 自動でつぎのフェーズへ
  render();
}

function start() {
  running = true;
  endTime = Date.now() + remaining * 1000;
  lastTick = Date.now();
  $("btnMain").textContent = "一時停止";
  if (mode === "work") { setScene("work"); say(WORK_MSGS[Math.floor(Math.random() * WORK_MSGS.length)]); }
  render();
}
function pause() {
  flushFocus();
  running = false;
  remaining = Math.max(0, (endTime - Date.now()) / 1000);
  lastTick = 0;
  $("btnMain").textContent = "再開";
  say("ひとやすみですね。続きはいつでも待っていますよ");
  render();
}
function reset(toWork) {
  flushFocus();
  running = false;
  lastTick = 0;
  if (toWork) { mode = "work"; doneSessions = 0; }
  remaining = totalSec();
  $("btnMain").textContent = "スタート";
  setScene("rest");
  say("スタートを押すと、集中がはじまりますよ🌙");
  render();
}

$("btnMain").addEventListener("click", () => running ? pause() : start());
$("btnSkip").addEventListener("click", () => {
  if (!running && remaining === totalSec()) return;
  endTime = Date.now();   // 即完了扱い
  if (!running) { running = true; lastTick = 0; }
  complete();
});
$("btnReset").addEventListener("click", () => reset(true));

/* ---------- モード切替 ---------- */
document.querySelectorAll(".mode").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    $("customRow").classList.toggle("show", !!btn.dataset.custom);
    $("customHint").classList.toggle("show", !!btn.dataset.custom);
    if (!btn.dataset.custom) {
      workMin = parseInt(btn.dataset.work, 10);
      breakMin = parseInt(btn.dataset.break, 10);
      reset(true);
    } else {
      applyCustom();
    }
  });
});
function applyCustom() {
  workMin = Math.min(120, Math.max(1, parseInt($("cWork").value, 10) || 30));
  breakMin = Math.min(30, Math.max(1, parseInt($("cBreak").value, 10) || 5));
  // 上限・下限で丸めた値を入力欄にも反映(120超などをそのまま残さない)
  $("cWork").value = workMin;
  $("cBreak").value = breakMin;
  reset(true);
}
$("cWork").addEventListener("change", applyCustom);
$("cBreak").addEventListener("change", applyCustom);

/* ---------- 初期化 ---------- */
setScene("rest");
setInterval(tick, 250);
renderStats();
render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
