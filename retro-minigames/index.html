<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>りんねの8bitミニゲーム集｜無料・登録不要のレトロミニゲーム</title>
<meta name="description" content="なつかしい操作×完全オリジナル題材の8bit風ミニゲーム3本。ぴったり満月・ほたる集め・ちょうちん暗記。無料・登録不要・インストール不要。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2f6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ===== 2026-09-28 刷新:「昔のゲームの紙の取扱説明書」 =====
     ページは2色刷り（紺と赤）の説明書の紙。見せ場は1つ: メニューを説明書の「もくじ」に（番号・題名・点線・ベスト）。
     遊ぶ画面（canvas）の中は変えない。実在のゲーム機・カセット・説明書の意匠には似せない */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  :root { --paper: #f1ead5; --paper2: #e8dfc4; --ink: #22201b; --sub: #5d574a; --navy: #1f2f6b; --red: #b8322e; --rule: #b7ab8c; }
  html, body { background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
  body { background-image: radial-gradient(rgba(90,70,30,.05) 1px, transparent 1.2px); background-size: 5px 5px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 10px 10px 18px; }

  /* 題名の帯（紺）と赤の細線 */
  .apphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px 9px 12px; margin-bottom: 12px;
    background: var(--navy); color: #f6f0dc; box-shadow: 0 3px 0 var(--paper), 0 5px 0 var(--red); }
  .apphead h1 { font-size: 17px; letter-spacing: .08em; color: #f6f0dc; }
  .apphead h1 .bit { color: #f6f0dc; box-shadow: inset 0 -3px 0 var(--red); }
  .iconbtn { background: transparent; color: var(--ink); border: 2px solid var(--ink); border-radius: 2px; font-size: 14px; font-weight: 700; padding: 6px 10px; cursor: pointer; touch-action: manipulation; }
  .apphead .iconbtn { color: #f6f0dc; border-color: rgba(246,240,220,.7); width: 38px; height: 34px; display: grid; place-items: center; padding: 0; }
  .iconbtn:active { transform: translateY(1px); }
  .iconbtn:focus-visible, .gcard:focus-visible, .mainbtn:focus-visible, .subbtn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .apphead .iconbtn:focus-visible { outline-color: #f6f0dc; }   /* 紺の帯の上では紙の色の枠（赤では見えにくい） */
  /* 効果音のオン・オフ（絵文字の代わりの線の絵） */
  .snd { width: 20px; height: 20px; background: currentColor;
    -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat;
    --m: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 9.5h3.5L12 5.5v13l-4.5-4H4z'/><path d='M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11'/></svg>"); }
  .muted .snd { --m: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 9.5h3.5L12 5.5v13l-4.5-4H4z'/><path d='M16 9.5l5 5M21 9.5l-5 5'/></svg>"); }
  @supports not ((mask-image: none) or (-webkit-mask-image: none)) { .snd { background: none; } .snd::before { content: "音"; font-size: 13px; } .muted .snd::before { text-decoration: line-through; } }
  @media (forced-colors: active) { .snd { forced-color-adjust: none; background: ButtonText; } }

  .screen { animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .lead { font-size: 13px; color: var(--sub); line-height: 1.8; margin-bottom: 10px; }

  /* もくじ */
  #menuCards { counter-reset: toc; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 2px 0; }
  #menuCards::before { content: "もくじ"; display: block; font-size: 12px; font-weight: 800; letter-spacing: .5em; color: var(--red); padding: 8px 2px 2px; }
  .gcard { counter-increment: toc; display: grid; grid-template-columns: 28px auto 1fr auto; grid-template-areas: "n t l b" ". d d d"; column-gap: 8px; align-items: center;
    width: 100%; text-align: left; background: transparent; border: none; border-bottom: 1px dashed var(--rule); border-radius: 0;
    padding: 11px 2px 10px; cursor: pointer; color: var(--ink); touch-action: manipulation; font: inherit; }
  .gcard:last-child { border-bottom: none; }
  .gcard::before { content: counter(toc); grid-area: n; width: 24px; height: 24px; display: grid; place-items: center;
    background: var(--navy); color: #fff;   /* 番号は紺の1色（2色刷り）。ゲームごとの色は遊ぶ画面の中だけ */ font-size: 13px; font-weight: 800; font-family: "Courier New", monospace; }
  .gcard::after { content: ""; grid-area: l; align-self: end; margin-bottom: 7px; min-width: 12px; border-bottom: 2px dotted var(--sub); }
  .gcard:hover, .gcard:active { background: rgba(31,47,107,.06); }
  .gcard .gt { grid-area: t; font-size: 15.5px; font-weight: 800; letter-spacing: .04em; }
  .gcard .gd { grid-area: d; font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 3px; }
  .gcard .gb { grid-area: b; white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }

  .note { font-size: 11px; color: var(--sub); line-height: 1.7; margin-top: 10px; }

  .gamebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .gamebar .gname { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: .06em; }
  #canvasBox { position: relative; display: flex; justify-content: center; }
  /* 画面は説明書に刷られた画面写真のように、黒い枠で囲む */
  #cv { box-sizing: content-box; image-rendering: pixelated;   /* content-box: 枠を外側に付け、タップ位置と拡大の倍率をずらさない */
        image-rendering: crisp-edges; background: #0b0e1d; border: 3px solid var(--ink); box-shadow: 4px 4px 0 rgba(34,32,27,.18); border-radius: 0; touch-action: none; display: block; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
  /* あそびかた欄 */
  .obox { background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 rgba(34,32,27,.35); border-radius: 0; padding: 0 16px 16px; max-width: 340px; width: 100%; text-align: center; }
  .obox h2 { font-size: 15px; color: #fff; background: var(--ink); margin: 0 -16px 12px; padding: 7px 10px; letter-spacing: .08em; }
  .obox p { font-size: 13px; color: var(--ink); line-height: 1.9; margin-bottom: 14px; text-align: left; }
  .obox p b { color: var(--red); }
  .mainbtn { background: var(--navy); color: #fff; border: none; border-radius: 2px; font-size: 15px; font-weight: 800; letter-spacing: .1em; padding: 12px 26px; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 0 #111a3f; }
  .mainbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #111a3f; }
  .subbtn { background: transparent; color: var(--ink); border: 2px solid var(--ink); border-radius: 2px; font-size: 13px; font-weight: 700; padding: 10px 16px; cursor: pointer; touch-action: manipulation; }
  .subbtn:active { transform: translateY(1px); }

  /* 記録用紙 */
  #scrResult { text-align: center; padding-top: 4px; }
  #scrResult h2 { font-size: 16px; color: var(--ink); margin-bottom: 10px; letter-spacing: .08em; }
  .scorebox { background: #faf6ea; border: 2px solid var(--ink); border-radius: 0; padding: 0; margin: 0 auto 14px; max-width: 300px; }
  .scorebox .row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; font-size: 14px; color: var(--sub); }
  .scorebox .row + .row { border-top: 1px solid var(--rule); }
  .scorebox .row b { font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .newbest { display: inline-block; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 0; padding: 2px 6px; margin-left: 6px; vertical-align: 3px; }
  .btns { display: flex; flex-direction: column; gap: 9px; max-width: 300px; margin: 0 auto; }
  #shareDone { font-size: 12px; color: var(--navy); font-weight: 700; margin-top: 8px; min-height: 1em; }
  #shareFallback { width: 100%; margin-top: 8px; background: #faf6ea; color: var(--ink); border: 1px solid var(--rule); border-radius: 0; font-size: 12px; padding: 8px; }

  footer { font-size: 10.5px; color: var(--sub); text-align: center; margin-top: 16px; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
</style>
<script src="jp-phrase-4.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="apphead">
    <h1>りんねの<span class="bit">8bit</span>ミニゲーム集</h1>
    <button id="btnMute" class="iconbtn" aria-label="消音"><span class="snd" aria-hidden="true"></span></button>
  </div>

  <!-- メニュー -->
  <div id="scrMenu" class="screen">
    <p class="lead">なつかしい操作×オリジナル題材のミニゲーム3本。すべて無料・登録不要・タップだけで遊べます</p>
    <div id="menuCards"></div>
    <p class="note">※ ベストスコアはこの端末の中だけに保存されるおまけ要素です。エンタメ用ミニゲームであり、ゲーム内に課金・広告のための会員登録はありません。</p>
  </div>

  <!-- ゲーム -->
  <div id="scrGame" class="screen" hidden>
    <div class="gamebar">
      <button id="btnQuit" class="iconbtn">← やめる</button>
      <span class="gname" id="gameName"></span>
    </div>
    <div id="canvasBox">
      <canvas id="cv" width="192" height="256"></canvas>
      <div id="howto" class="overlay" hidden>
        <div class="obox">
          <h2 id="howtoTitle"></h2>
          <p id="howtoBody"></p>
          <button id="btnStart" class="mainbtn">スタート</button>
        </div>
      </div>
    </div>
  </div>

  <!-- リザルト -->
  <div id="scrResult" class="screen" hidden>
    <h2 id="resTitle"></h2>
    <div class="scorebox">
      <div class="row"><span>スコア</span><b id="resScore">0</b></div>
      <div class="row"><span>ベスト</span><span><b id="resBest">0</b><span id="resNew" class="newbest" hidden>NEW!</span></span></div>
    </div>
    <div class="btns">
      <button id="btnRetry" class="mainbtn">もういちど</button>
      <button id="btnShare" class="subbtn">シェア文をコピー</button>
      <button id="btnMenu" class="subbtn">メニューへもどる</button>
    </div>
    <div id="shareDone"></div>
    <textarea id="shareFallback" rows="3" readonly hidden></textarea>
  </div>

  <footer>りんねブログの無料ミニゲームです。データはすべてこの端末内にのみ保存され、外部への送信はありません。</footer>
</div>

<script src="core.js"></script>
<script src="logic.js"></script>
<script src="games.js"></script>

      navigator.serviceWorker.register("sw.js").catch(function () {});

</body>
</html>
