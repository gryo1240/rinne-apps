<!--
  起動できなかったときの救済（2026-08-09 追加）

  【なぜ必要か】2026-08-08 の事故
  ブラウザが**古いJSと新しいJSを混ぜて**読み込むと、
    The requested module './dom.js' does not provide an export named 'fxOff'
  でモジュールの読み込みが丸ごと失敗する。#app は空のままなので、
  プレイヤーには**ただの真っ黒な画面**にしか見えず、打つ手が分からない。

  【なぜここに直接書くか】
  外部ファイルにすると**それ自体が古いキャッシュになりうる**ので、救済が救済にならない。
  `type="module"` は defer 相当なので、この普通のscriptのほうが必ず先に走る。

  【自動で復旧しない理由】
  `location.reload()` はサブリソース（JSモジュール）のキャッシュを無効化しない仕様なので、
  勝手に再読み込みしても同じ古いJSでまた失敗し、無限ループになるだけ。
  必ず**人がボタンを押す**形にしてある。
-->
<script>
(function () {
  var failed = null;

  // モジュールの読み込み失敗は window の error として上がってくる
  window.addEventListener('error', function (e) {
    if (!failed) failed = (e && e.message) || 'unknown';
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (!failed) failed = (e && e.reason && e.reason.message) || 'unhandled rejection';
  });

  function esc(s) { return String(s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }

  function rescue() {
    var app = document.getElementById('app');
    // ★「エラーが出た」だけでは出さない。**画面が本当に空のときだけ**出す。
    //   絵の404などは起きても遊べるので、それで救済画面を出したら邪魔なだけ
    if (!app || app.children.length > 0) return;

    app.innerHTML =
      '<div style="padding:24px;max-width:34em;margin:0 auto;color:#e8d9b0;font-family:sans-serif;line-height:1.7">' +
      '<h1 style="font-size:1.2rem;margin:0 0 12px">読み込みに失敗しました</h1>' +
      '<p style="margin:0 0 12px">保存されている古いデータが残っているのが原因のことがほとんどです。' +
      '下のボタンで古いデータを捨てて、読み込み直してください。</p>' +
      '<p style="margin:0 0 16px;font-size:.9rem;opacity:.8">' +
      '<strong>セーブデータは消えません。</strong>ただし、塔に潜っている途中だった場合、その潜行はやり直しになります。</p>' +
      '<button id="rescueBtn" style="font-size:1rem;padding:12px 20px;border-radius:8px;border:1px solid #c9a227;' +
      'background:#c9a227;color:#1a1520;font-weight:bold;cursor:pointer">古いデータを捨てて読み込み直す</button>' +
      '<p style="margin:16px 0 0;font-size:.85rem;opacity:.7">それでも直らないときは、キーボードなら ' +
      '<strong>Ctrl+Shift+R</strong>、スマホなら再読み込みボタンを長押しして「キャッシュを無視して再読み込み」を選んでください。</p>' +
      '<p style="margin:12px 0 0;font-size:.75rem;opacity:.5">' + esc(failed || '') + '</p>' +
      '</div>';

    document.getElementById('rescueBtn').addEventListener('click', function () {
      this.disabled = true;
      this.textContent = '片づけています…';
      var jobs = [];

      // ★このアプリのキャッシュだけ消す。`caches.keys()` はオリジン単位なので、
      //   絞らないと同じ場所で公開している他のアプリまで巻き添えになる
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) {
            return k.indexOf('rinne-tou-') === 0 ? caches.delete(k) : null;
          }));
        }).catch(function () {}));
      }
      // ★このページのSWだけ解除する（getRegistrations() の全解除はしない）
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        jobs.push(navigator.serviceWorker.getRegistration().then(function (r) {
          return r ? r.unregister() : null;
        }).catch(function () {}));
      }
      // localStorage には**絶対に触れない**。セーブがそこにあり、
      // しかもオリジンは他アプリと共有なので clear() は全アプリのセーブを消す
      Promise.all(jobs).then(function () {
        location.replace(location.pathname + '?_r=' + Date.now());
      });
    });
  }

  // 読み込みが終わってから判定する（モジュールは defer 相当なので load を待つ）
  window.addEventListener('load', function () { setTimeout(rescue, 300); });
})();
</script>
